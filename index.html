<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>喜帖无名 | Nameless Wedding</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 进入游戏页面 -->
  <section id="start-screen" class="start-screen">
    <div class="start-content">
      <p class="start-subtitle">NAMeless Wedding</p>

      <h1>喜帖无名</h1>

      <p class="start-description">
        那封没有名字的喜帖，将你带进了一座无人宅院。
      </p>

      <button id="start-button" type="button">
        进入宅院
      </button>
    </div>
  </section>


  <!-- 游戏主界面 -->
  <main id="game" class="game hidden">

    <!-- 16:9游戏画面 -->
    <section id="game-stage" class="game-stage">

      <!-- 场景背景 -->
      <img
        id="scene-background"
        class="scene-background"
        src="images/hall/screen1.jpg"
        alt="宅院门厅"
      >

      <!-- 透明道具会由JavaScript放进这里 -->
      <div id="prop-layer" class="prop-layer"></div>

      <!-- 顶部界面 -->
      <header class="game-header">
        <button
          id="map-button"
          class="ui-button"
          type="button"
        >
          地图
        </button>

        <h2 id="scene-title">宅院门厅</h2>

        <button
          id="sound-button"
          class="ui-button"
          type="button"
        >
          音效
        </button>
      </header>

      <!-- 场景提示 -->
      <div id="message-box" class="message-box">
        <p id="message-text">
          院门在身后关上了。柜台上的收音机突然传来杂音。
        </p>
      </div>

      <!-- 底部道具栏 -->
      <section class="inventory-panel">
        <button
          id="clue-button"
          class="inventory-side-button"
          type="button"
        >
          线索
        </button>

        <div id="inventory-list" class="inventory-list">
          <!-- 收集的道具会显示在这里 -->
        </div>

        <button
          id="reset-button"
          class="inventory-side-button"
          type="button"
        >
          重置
        </button>
      </section>

    </section>
  </main>


  <!-- 地图弹窗 -->
  <section
    id="map-panel"
    class="overlay-panel hidden"
    aria-hidden="true"
  >
    <div class="panel-content">

      <button
        class="close-button"
        data-close="map-panel"
        type="button"
      >
        ×
      </button>

      <h2>宅院地图</h2>

      <div id="location-list" class="location-list">
        <!-- 已发现地点由JavaScript显示 -->
      </div>

    </div>
  </section>


  <!-- 线索面板 -->
  <section
    id="clue-panel"
    class="overlay-panel hidden"
    aria-hidden="true"
  >
    <div class="panel-content">

      <button
        class="close-button"
        data-close="clue-panel"
        type="button"
      >
        ×
      </button>

      <h2>已发现线索</h2>

      <div id="clue-list" class="clue-list">
        <p class="empty-message">暂时没有发现线索。</p>
      </div>

    </div>
  </section>


  <!-- 道具与剧情弹窗 -->
  <section
    id="item-modal"
    class="overlay-panel hidden"
    aria-hidden="true"
  >
    <div class="item-modal-content">

      <button
        class="close-button"
        data-close="item-modal"
        type="button"
      >
        ×
      </button>

      <img
        id="modal-image"
        src=""
        alt=""
      >

      <h2 id="modal-title"></h2>

      <p id="modal-description"></p>

      <div id="modal-actions" class="modal-actions"></div>

    </div>
  </section>


  <script src="script.js"></script>
</body>
</html>
